<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tangram">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Tangram Puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5efe4; --panel:#fffaf2; --ink:#2b2a33; --muted:#7a7468; --line:#e6dccb;
  --shadow:#3b3f4c; --accent:#e85d4a; --accent2:#3b8ea5; --good:#4da167;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
/* home */
#home{overflow-y:auto;align-items:center;padding:max(28px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
.logo{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.logo h1{font-size:44px;margin:0;font-weight:700;letter-spacing:1px}
.tag{color:var(--muted);margin:0 0 22px;text-align:center}
.step{width:100%;max-width:620px;margin-bottom:22px}
.step h2{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 10px;font-weight:600}
.choices{display:grid;gap:12px}
.c2{grid-template-columns:1fr 1fr}.c4{grid-template-columns:repeat(4,1fr)}
@media (max-width:560px){.c4{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 12px;text-align:center;transition:.15s;color:var(--ink)}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
.card .big{font-size:30px;line-height:1.1}
.card .t{font-weight:600;font-size:18px;margin-top:4px}
.card .s{font-size:13px;color:var(--muted)}
.play{background:var(--accent);color:#fff;font-size:22px;font-weight:600;padding:14px 48px;border-radius:999px;box-shadow:0 5px 0 #b8402f;margin-top:4px}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 #b8402f}
.mini{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:15px;color:var(--ink)}
.pill b{font-weight:600}
.dev{margin:26px 0 0;font-size:12px;color:var(--muted);letter-spacing:.3px}
/* game */
#game{background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.iconbtn{background:var(--panel);border:2px solid var(--line);border-radius:12px;width:42px;height:42px;font-size:20px;display:grid;place-items:center;color:var(--ink);flex:none}
.title{flex:1;min-width:0}
.title .n{font-weight:600;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title .m{font-size:13px;color:var(--muted)}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:5px 10px;text-align:center;min-width:64px}
.stat .v{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
#boardWrap{flex:1;position:relative;min-height:0;margin:0 10px;border-radius:20px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
#board{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.piece{cursor:grab;stroke:rgba(255,255,255,.75);stroke-width:1.5;stroke-linejoin:round;transition:filter .15s}
.piece.drag{cursor:grabbing;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.piece.sel{stroke:var(--ink);stroke-width:2.5}
.piece.locked{cursor:default}
.eye{animation:pop .4s ease}@keyframes pop{from{transform-box:fill-box;transform-origin:center;transform:scale(0)}to{transform-box:fill-box;transform-origin:center;transform:scale(1)}}
.piece.won{stroke:rgba(0,0,0,.18);stroke-width:.6}
.piece.anim{transition:all .45s ease}
#target{fill:var(--shadow)}
.tools{display:flex;gap:8px;justify-content:center;padding:10px 10px;padding-bottom:max(12px,env(safe-area-inset-bottom));flex-wrap:wrap}
.tool{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:9px 14px;font-size:16px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:6px}
.tool:active{transform:translateY(2px)}
.tool.warn{color:#9a3b2c}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:.92}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(43,42,51,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov.on{display:flex}
.dlg{background:var(--panel);border-radius:22px;padding:24px 22px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);max-height:100%;overflow-y:auto}
.dlg h3{margin:0 0 4px;font-size:26px}
.reveal{font-size:64px;line-height:1.1;margin:8px 0 2px}
.rname{font-size:24px;font-weight:600;margin-bottom:12px}
.brk{background:var(--bg);border-radius:14px;padding:10px 14px;margin:10px 0 16px;text-align:left;font-size:15px}
.brk div{display:flex;justify-content:space-between;padding:2px 0}
.brk .tot{border-top:2px dashed var(--line);margin-top:6px;padding-top:6px;font-weight:600;font-size:18px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn2{background:var(--panel);border:2px solid var(--line);color:var(--ink);font-size:17px;font-weight:500;padding:11px 20px;border-radius:999px}
.btnp{background:var(--accent);color:#fff;font-size:17px;font-weight:600;padding:11px 24px;border-radius:999px;box-shadow:0 4px 0 #b8402f}
/* scores */
#scores{overflow-y:auto;align-items:center;padding:16px 14px 40px}
.shead{width:100%;max-width:760px;display:flex;align-items:center;gap:12px;margin-bottom:14px}
.shead h2{margin:0;font-size:28px;flex:1}
.sgrid{width:100%;max-width:760px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:560px){.sgrid{grid-template-columns:1fr}}
.scard{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:16px}
.scard h3{margin:0 0 10px;font-size:20px;display:flex;align-items:center;gap:8px}
.badge{font-size:12px;padding:3px 9px;border-radius:999px;color:#fff}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:12px;padding:8px 10px}
.kv .v{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.kv .l{font-size:12px;color:var(--muted)}
.coll{width:100%;max-width:760px;margin-top:18px}
.coll h3{font-size:18px;margin:6px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;min-height:76px}
.tile .em{font-size:26px}
.tile.no{color:#bbb}.tile.no .em{filter:grayscale(1);opacity:.35}
.tile .bd{display:flex;gap:3px;justify-content:center;margin-top:3px}
.tile .bd span{font-size:10px;border-radius:6px;padding:0 5px;color:#fff}
.e-c{background:var(--good)}.h-c{background:var(--accent)}
#doneBar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;display:none;align-items:center;gap:12px;font-weight:600;font-size:17px;box-shadow:0 8px 20px rgba(0,0,0,.12);white-space:nowrap}
#doneBar.on{display:flex}
#doneBar .btnp{padding:8px 18px;font-size:15px}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:20}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="logo">
    <svg width="56" height="56" viewBox="0 0 4 4" aria-hidden="true">
      <polygon points="0,0 4,0 2,2" fill="#E85D4A"/><polygon points="0,0 2,2 0,4" fill="#F2A541"/>
      <polygon points="2,4 4,4 4,2" fill="#4DA167"/><polygon points="4,0 4,2 3,1" fill="#3B8EA5"/>
      <polygon points="2,2 3,3 1,3" fill="#7A5CC0"/><polygon points="2,2 3,1 4,2 3,3" fill="#F5C842"/>
      <polygon points="0,4 1,3 3,3 2,4" fill="#E66FA6"/>
    </svg>
    <h1>Tangram</h1>
  </div>
  <p class="tag">Fill the shadow using every piece. What will it turn out to be?</p>

  <div class="step">
    <h2>1 · Choose your level</h2>
    <div class="choices c2" id="lvlChoices">
      <button class="card sel" data-lvl="easy"><div class="big">🙂</div><div class="t">Easy</div><div class="s">7 pieces</div></button>
      <button class="card" data-lvl="hard"><div class="big">🧠</div><div class="t">Difficult</div><div class="s">15 pieces</div></button>
    </div>
  </div>
  <div class="step">
    <h2>2 · Choose a puzzle type</h2>
    <div class="choices c4" id="modeChoices">
      <button class="card" data-mode="square"><div class="big">🟧</div><div class="t">Square</div><div class="s">Rebuild the square</div></button>
      <button class="card sel" data-mode="animal"><div class="big">🐾</div><div class="t">Animals</div><div class="s" id="cntA">50 hidden</div></button>
      <button class="card" data-mode="object"><div class="big">🏠</div><div class="t">Objects</div><div class="s" id="cntO">50 hidden</div></button>
      <button class="card" data-mode="mixed"><div class="big">🎲</div><div class="t">Surprise</div><div class="s">Animals + objects</div></button>
    </div>
  </div>
  <div class="step">
    <h2>3 · Piece style</h2>
    <div class="choices c2" id="styleChoices">
      <button class="card" data-style="themed"><div class="big">🦒</div><div class="t">Themed</div><div class="s">Skins &amp; colours (a little clue)</div></button>
      <button class="card" data-style="plain"><div class="big">🎨</div><div class="t">Mystery</div><div class="s">Plain pieces, theme revealed at the end</div></button>
    </div>
  </div>
  <button class="play" id="playBtn">Play ▶</button>
  <div class="mini">
    <span class="pill">🙂 Easy: <b id="miniE">0</b> pts</span>
    <span class="pill">🧠 Difficult: <b id="miniH">0</b> pts</span>
    <button class="pill" id="scoreBtn">🏆 Scoreboard</button>
  </div>
  <p class="dev">Developer: Vikas C. Srivastava</p>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="top">
    <button class="iconbtn" id="homeBtn" title="Home">⌂</button>
    <div class="title"><div class="n" id="gName">Mystery shape</div><div class="m" id="gMeta">Easy · Animals</div></div>
    <div class="stat"><div class="v" id="gTime">0:00</div><div class="l">Time</div></div>
    <div class="stat"><div class="v" id="gPts">0</div><div class="l">Score</div></div>
  </div>
  <div id="boardWrap">
    <svg id="board"><defs id="defs"></defs><g id="tg"></g><g id="pg"></g><g id="eg"></g></svg>
    <div class="toast" id="toast"></div><div id="doneBar"><span id="dbTxt"></span><button class="btnp" id="dbNext">Next ▶</button></div>
  </div>
  <div class="tools">
    <button class="tool" id="rotBtn" title="Rotate (R)">⟳ Rotate</button>
    <button class="tool" id="flipBtn" title="Flip (F)">⇋ Flip</button>
    <button class="tool" id="hintBtn">💡 Hint</button>
    <button class="tool" id="resetBtn">↺ Reset</button>
    <button class="tool warn" id="giveBtn">🏳 Give up</button>
  </div>
</section>

<!-- SCORES -->
<section id="scores" class="screen">
  <div class="shead"><button class="iconbtn" id="sBack">←</button><h2>🏆 Scoreboard</h2><button class="btn2" id="sReset" style="font-size:14px;padding:8px 14px">Reset</button></div>
  <div class="sgrid" id="sGrid"></div>
  <div class="coll" id="coll"></div>
</section>

<!-- overlays -->
<div class="ov" id="winOv"><div class="dlg">
  <h3 id="wTitle">Solved! 🎉</h3>
  <div class="reveal" id="wEmoji"></div>
  <div class="rname" id="wName"></div>
  <div class="brk" id="wBrk"></div>
  <div class="row"><button class="btn2" id="wHome">Home</button><button class="btn2" id="wView">👀 View</button><button class="btnp" id="wNext">Next puzzle ▶</button></div>
</div></div>
<div class="ov" id="confOv"><div class="dlg">
  <h3 id="cTitle">Are you sure?</h3><p id="cText" style="color:var(--muted)"></p>
  <div class="row"><button class="btn2" id="cNo">Cancel</button><button class="btnp" id="cYes">Yes</button></div>
</div></div>
<canvas id="fx"></canvas>

/* ---------- geometry ---------- */
const QC=[[.5,.2],[.8,.5],[.5,.8],[.2,.5]];
function pip(px,py,P){let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const[x1,y1]=P[i],[x2,y2]=P[j];
  if((y1>py)!==(y2>py)&&px<x1+(py-y1)*(x2-x1)/(y2-y1))ins=!ins}return ins}
function quarters(P){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);const out=[];
  for(let j=Math.floor(Math.min(...ys));j<Math.ceil(Math.max(...ys));j++)
   for(let i=Math.floor(Math.min(...xs));i<Math.ceil(Math.max(...xs));i++)
    for(let q=0;q<4;q++)if(pip(i+QC[q][0],j+QC[q][1],P))out.push(j+','+i+','+q);
  return out}
const pairs=f=>{const r=[];for(let i=0;i<f.length;i+=2)r.push([f[i],f[i+1]]);return r};
function hardSplit(sol){const out=[];
  for(const[t,P]of sol){
    if(t!=='L'){out.push([t,P]);continue}
    const[p0,p1,p2]=P;const a=[(p1[0]-p0[0])/4,(p1[1]-p0[1])/4];
    const b=[(p2[0]-p0[0])/2-a[0],(p2[1]-p0[1])/2-a[1]];
    for(const[st,sp]of LSUB)out.push([st,sp.map(([x,y])=>[p0[0]+a[0]*x+b[0]*y,p0[1]+a[1]*x+b[1]*y])]);
  }return out}

function centroid(P){let x=0,y=0;P.forEach(p=>{x+=p[0];y+=p[1]});return[x/P.length,y/P.length]}

function pickPuzzle(){

  const pool=PUZ.filter(p=>mode==='mixed'||p.c===mode);
  const ck=level+'-'+mode;let seen=S.cycle[ck]||[];

  if(H&&!own)sol=hardSplit(sol);

/* lay out: target + tray of scattered pieces, all in display units, then fit to view */
function layout(){

  const tb=(()=>{let b=null;G.sol.forEach(([t,P])=>{const q=dbbox(P);b=b?{x0:Math.min(b.x0,q.x0),y0:Math.min(b.y0,q.y0),x1:Math.max(b.x1,q.x1),y1:Math.max(b.y1,q.y1)}:q});return b})();

svg.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;const s=svgPt(e);
  const dx=s[0]-drag.start[0],dy=s[1]-drag.start[1];if(Math.hypot(dx,dy)>6)drag.moved=true;
  if(!drag.moved)return;const d=undisp([dx/view.k,dy/view.k]);
  drag.p.P=drag.P0.map(q=>[q[0]+d[0],q[1]+d[1]]);drawPiece(drag.p,G.pieces.indexOf(drag.p));
});
function endDrag(e){if(!drag||e.pointerId!==drag.id)return;const p=drag.p;p.el.classList.remove('drag');
  p.P=drag.moved?snap(p.P):rot90(p.P);drag=null;drawPieces();check()}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);
function act(fn){if(!G||G.done)return;const p=G.sel;if(!p||p.locked){toast('Tap a piece first');return}p.P=fn(p.P);drawPieces();check()}
$('rotBtn').onclick=()=>act(rot90);$('flipBtn').onclick=()=>act(flipH);
document.addEventListener('keydown',e=>{if(!$('game').classList.contains('on'))return;
  if(e.key==='r'||e.key==='R')act(rot90);if(e.key==='f'||e.key==='F')act(flipH)});

/* ---------- checking ---------- */
function check(){
  if(G.done)return;const seen=new Set();
  for(const p of G.pieces)for(const q of quarters(p.P)){if(seen.has(q)||!G.target.has(q))return;seen.add(q)}
  if(seen.size===G.target.size)win();
}
const key=P=>quarters(P).sort().join('|');
function hint(){
  if(G.done)return;
  const slots=G.pieces.map(p=>({t:p.t,P:p.slot,k:key(p.slot)}));
  const placedKeys=new Map();G.pieces.forEach(p=>placedKeys.set(p,key(p.P)));
  const filled=new Set(),okPieces=new Set();
  slots.forEach((s,i)=>{for(const p of G.pieces)if(p.t===s.t&&!okPieces.has(p)&&placedKeys.get(p)===s.k){filled.add(i);okPieces.add(p);break}});
  const open=slots.map((s,i)=>i).filter(i=>!filled.has(i));if(!open.length)return;
  // prefer big pieces first
  const order={L:0,M:1,Q:2,P:3,S:4,U:5,T:6};open.sort((a,b)=>order[slots[a].t]-order[slots[b].t]);
  const si=open[0],s=slots[si];
  const cand=G.pieces.filter(p=>p.t===s.t&&!okPieces.has(p)&&!p.locked);const p=cand[0];if(!p)return;
  // move away anything not-correct that overlaps that slot
  const sq=new Set(quarters(s.P));
  G.pieces.forEach(o=>{if(o===p||okPieces.has(o)||o.locked)return;if(quarters(o.P).some(q=>sq.has(q))&&o.home)o.P=o.home.map(q=>q.slice())});
  p.P=s.P.map(q=>q.slice());G.hints++;G.sel=p;pg.appendChild(p.el);
  animatePieces();toast('Hint: −'+(level==='easy'?25:50)+' points');setTimeout(check,480);
}
function animatePieces(){G.pieces.forEach(p=>p.el.classList.add('anim'));drawPieces();setTimeout(()=>G.pieces.forEach(p=>p.el.classList.remove('anim')),500)}
$('hintBtn').onclick=hint;
$('resetBtn').onclick=()=>{if(!G||G.done)return;G.pieces.forEach(p=>{if(!p.locked&&p.home)p.P=p.home.map(q=>q.slice())});animatePieces()};
$('giveBtn').onclick=()=>{if(!G||G.done)return;confirmBox('Give up?','The answer will be shown and this puzzle scores 0 points.',()=>{
  G.given=true;G.pieces.forEach(p=>p.P=p.slot.map(q=>q.slice()));animatePieces();setTimeout(win,600)})};

/* ---------- scoring / win ---------- */
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function curPts(){if(!G)return 0;const t=(Date.now()-G.start)/1000;
  const base=level==='easy'?100:250,bonus=Math.max(0,Math.round((level==='easy'?120:300)-t)),hp=G.hints*(level==='easy'?25:50);
  return{base,bonus,hp,total:Math.max(10,base+bonus-hp),t}}
function updPts(){if(!G||G.done)return;const c=curPts();$('gTime').textContent=fmt(c.t);$('gPts').textContent=c.total}
setInterval(updPts,500);
function win(){
  G.done=true;const c=curPts();const L=S[level];
  if(G.skin){G.themed=true;G.pieces.forEach((p,i)=>applyFill(p,i))}
  drawEyes(true);
  G.pieces.forEach(p=>{p.el.classList.add('won');p.el.classList.remove('sel')});
  let html='';
  if(G.given){L.streak=0;html=`<div><span>Answer shown</span><span>0</span></div><div class="tot"><span>Points</span><span>0</span></div>`}
  else{L.pts+=c.total;L.solved++;L.streak++;L.bestStreak=Math.max(L.bestStreak,L.streak);L.hints+=G.hints;
    if(L.best===null||c.t<L.best)L.best=Math.round(c.t);
    if(G.puz.c!=='square')L.found[G.puz.n]=(L.found[G.puz.n]||0)+1; else L.found['__square']=(L.found['__square']||0)+1;
    try{if(window.countSolved)countSolved()}catch(e){}
    html=`<div><span>Solved</span><span>+${c.base}</span></div><div><span>Speed bonus (${fmt(c.t)})</span><span>+${c.bonus}</span></div>`+
      (c.hp?`<div><span>Hints (${G.hints})</span><span>−${c.hp}</span></div>`:'')+
      `<div class="tot"><span>Points</span><span>${c.total}</span></div><div style="color:var(--muted);font-size:13px"><span>Total ${level==='easy'?'Easy':'Difficult'} score</span><span>${L.pts}</span></div>`}
  save();
  $('wTitle').textContent=G.given?'Here it is!':'Solved! 🎉';
  $('wEmoji').textContent=G.puz.e;
  $('wName').textContent=G.puz.c==='square'?'You made the square!':'It was '+(/^[AEIOU]/.test(G.puz.n)?'an ':'a ')+G.puz.n+'!';
  if(G.given&&G.puz.c==='square')$('wName').textContent='The square';
  $('wBrk').innerHTML=html;$('gPts').textContent=G.given?0:c.total;
  if(!G.given)confetti();
  setTimeout(()=>$('winOv').classList.add('on'),G.given?900:1700);
}
$('wNext').onclick=()=>{$('winOv').classList.remove('on');newGame()};
$('wView').onclick=()=>{$('winOv').classList.remove('on');$('dbTxt').textContent=G.puz.e+' '+$('wName').textContent;$('doneBar').classList.add('on')};
$('dbNext').onclick=()=>newGame();
$('wHome').onclick=()=>{$('winOv').classList.remove('on');show('home')};

/* ---------- confetti ---------- */
function confetti(){const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const P=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,a:Math.random()*6,va:(Math.random()-.5)*.3,c:COL7[Math.floor(Math.random()*7)]}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=p.va;
    x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.beginPath();x.moveTo(0,-p.r);x.lineTo(p.r,p.r);x.lineTo(-p.r,p.r);x.fill();x.restore()});
    if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})()}

/* ---------- misc UI ---------- */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600)}
function confirmBox(title,text,yes){$('cTitle').textContent=title;$('cText').textContent=text;$('confOv').classList.add('on');
  $('cYes').onclick=()=>{$('confOv').classList.remove('on');yes()};$('cNo').onclick=()=>$('confOv').classList.remove('on')}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));if(id==='home')updMini();if(id==='scores')renderScores()}
function updMini(){$('miniE').textContent=S.easy.pts;$('miniH').textContent=S.hard.pts}
document.querySelectorAll('#lvlChoices .card').forEach(b=>b.onclick=()=>{level=b.dataset.lvl;document.querySelectorAll('#lvlChoices .card').forEach(x=>x.classList.toggle('sel',x===b))});
document.querySelectorAll('#modeChoices .card').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('#modeChoices .card').forEach(x=>x.classList.toggle('sel',x===b))});
if(!S.style)S.style='themed';
function selStyle(){document.querySelectorAll('#styleChoices .card').forEach(x=>x.classList.toggle('sel',x.dataset.style===S.style))}
document.querySelectorAll('#styleChoices .card').forEach(b=>b.onclick=()=>{S.style=b.dataset.style;save();selStyle()});selStyle();
$('playBtn').onclick=()=>{show('game');requestAnimationFrame(newGame)};
$('homeBtn').onclick=()=>show('home');
$('scoreBtn').onclick=()=>show('scores');$('sBack').onclick=()=>show('home');
$('sReset').onclick=()=>confirmBox('Reset all scores?','This clears points, times and found shapes for both levels.',()=>{S={easy:blank(),hard:blank(),cycle:{},style:S.style};save();renderScores()});
addEventListener('resize',()=>{if(G&&$('game').classList.contains('on')){fitView();render();drawEyes(G.done)}});
$('cntA').textContent=PUZ.filter(p=>p.c==='animal').length+' hidden';
$('cntO').textContent=PUZ.filter(p=>p.c==='object').length+' hidden';

function renderScores(){
  const card=(lv,name,emo,color)=>{const L=S[lv];const nf=Object.keys(L.found).filter(k=>k!=='__square').length;
    return `<div class="scard"><h3>${emo} ${name} <span class="badge" style="background:${color}">${lv==='easy'?'7':'15'} pieces</span></h3><div class="kv">
    <div><div class="v">${L.pts}</div><div class="l">Total points</div></div>
    <div><div class="v">${L.solved}</div><div class="l">Puzzles solved</div></div>
    <div><div class="v">${L.best===null?'–':fmt(L.best)}</div><div class="l">Fastest solve</div></div>
    <div><div class="v">${L.bestStreak}</div><div class="l">Best streak</div></div>
    <div><div class="v">${nf}/${PUZ.length}</div><div class="l">Shapes discovered</div></div>
    <div><div class="v">${L.found.__square||0}</div><div class="l">Squares made</div></div></div></div>`};
  $('sGrid').innerHTML=card('easy','Easy','🙂','var(--good)')+card('hard','Difficult','🧠','var(--accent)');
  const sec=(cat,title)=>{const list=PUZ.filter(p=>p.c===cat);const n=list.filter(p=>S.easy.found[p.n]||S.hard.found[p.n]).length;
    return `<h3>${title} found: ${n}/${list.length}</h3><div class="tiles">`+list.map(p=>{const e=S.easy.found[p.n],h=S.hard.found[p.n];
      return (e||h)?`<div class="tile"><div class="em">${p.e}</div>${p.n}<div class="bd">${e?'<span class="e-c">Easy</span>':''}${h?'<span class="h-c">Hard</span>':''}</div></div>`
        :`<div class="tile no"><div class="em">❔</div>???</div>`}).join('')+'</div>'};
  $('coll').innerHTML=sec('animal','🐾 Animals')+sec('object','🏠 Objects');
}
updMini();
</script>
